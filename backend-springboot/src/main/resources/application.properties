server.port=8080

# H2 In-Memory Database
spring.datasource.url=${DB_URL:jdbc:h2:mem:marketplace_onboarding;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Camunda 8 / Zeebe connection (self-managed or Camunda Cloud)
zeebe.client.broker.grpc-address=${ZEEBE_GRPC_ADDRESS:http://localhost:26500}
zeebe.client.security.plaintext=true
zeebe.client.cloud.client-id=${ZEEBE_CLIENT_ID:}
zeebe.client.cloud.client-secret=${ZEEBE_CLIENT_SECRET:}

# CORS
spring.mvc.cors.allowed-origins=http://localhost:5173
